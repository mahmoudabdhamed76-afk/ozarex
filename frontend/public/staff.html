<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0809">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="staff/manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<title>حضور وانصراف</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#F3EFEF;--card:#fff;--soft:#F7F3F3;--line:#E8E0E0;--ink:#16110F;--mut:#6E6567;--faint:#A39A9B;--red:#E01B0F;--red2:#B3120A;--ok:#1E9A4C;--warn:#D98200;--hero:#16110F;--hero-ink:#F4F0F0;--hero-mut:#A39A9B}
:root[data-t=dark]{--bg:#0c0809;--card:#171112;--soft:#1f1819;--line:#2b2223;--ink:#F4F0F0;--mut:#A39A9B;--faint:#6f6667;--hero:#1b1314;--hero-ink:#F4F0F0}
@media (prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0c0809;--card:#171112;--soft:#1f1819;--line:#2b2223;--ink:#F4F0F0;--mut:#A39A9B;--faint:#6f6667;--hero:#1b1314}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Cairo',Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.w{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .lg{width:44px;height:44px;border-radius:13px;background:var(--red);display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 8px 20px -10px var(--red)}
.top .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.top .lg b{font:900 22px/1 'Zain','IBM Plex Sans Arabic',sans-serif;color:#fff}
.top .nm{min-width:0;flex:1}.top .nm b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .nm span{font-size:12.5px;color:var(--mut)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:19px;height:19px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* login */
.lgn{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center}
.lgn .brand{text-align:center;margin-bottom:22px}
.lgn .brand .lg{width:72px;height:72px;border-radius:22px;margin:0 auto 12px;background:var(--red);display:grid;place-items:center;overflow:hidden;box-shadow:0 18px 40px -16px var(--red)}
.lgn .brand .lg img{width:100%;height:100%;object-fit:contain;background:#fff}.lgn .brand .lg b{font:900 38px/1 'Zain',sans-serif;color:#fff}
.lgn h1{margin:0;font:800 24px/1.3 'Zain','IBM Plex Sans Arabic',sans-serif}.lgn p{margin:4px 0 0;color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:22px;padding:18px;border:1px solid var(--line)}
label{display:block;font-size:12.5px;color:var(--mut);margin:0 2px 6px;font-weight:600}
.in{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);padding:0 14px;outline:none;transition:border-color .15s}
.in:focus{border-color:var(--red)}
.fld{margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:15px;background:var(--red);color:#fff;font-weight:700;font-size:16px;cursor:pointer;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.55}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.err{background:rgba(224,27,15,.1);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:none}.err.on{display:block}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.7}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:22px 18px 20px;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.hero::before{content:"";position:absolute;inset:auto -30% -55% -30%;height:80%;background:radial-gradient(closest-side,rgba(224,27,15,.34),transparent);pointer-events:none}
.hero .clk{font:800 44px/1.1 'Zain','IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.5px;text-align:center;direction:ltr}
.hero .dt{text-align:center;color:var(--hero-mut);font-size:13px;margin-top:2px}
.st{display:flex;justify-content:center;margin:14px 0 4px;position:relative}
.stc{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;background:rgba(255,255,255,.09);color:var(--hero-ink)}
.stc i{width:8px;height:8px;border-radius:50%;background:#8a8082}
.stc.in i{background:#34d17a;box-shadow:0 0 0 0 rgba(52,209,122,.6);animation:pl 1.8s infinite}.stc.done i{background:var(--warn)}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(52,209,122,0)}100%{box-shadow:0 0 0 0 rgba(52,209,122,0)}}
.pbw{position:relative;display:grid;place-items:center;margin:16px 0 8px;height:178px}
.pb{width:148px;height:148px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:17px;display:grid;place-items:center;text-align:center;line-height:1.4;position:relative;z-index:2;background:radial-gradient(circle at 35% 28%,#ff4a3d,var(--red) 55%,var(--red2));box-shadow:0 18px 40px -12px rgba(224,27,15,.7),inset 0 2px 0 rgba(255,255,255,.28);transition:transform .15s}
.pb:active{transform:scale(.94)}.pb[disabled]{filter:grayscale(.7);opacity:.7}
.pb.out{background:radial-gradient(circle at 35% 28%,#3a3032,#1c1415 60%,#0f0a0b);box-shadow:0 18px 40px -14px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.14),0 0 0 2px rgba(224,27,15,.55)}
.pb small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.rg{position:absolute;width:148px;height:148px;border-radius:50%;border:2px solid rgba(224,27,15,.55);z-index:1;animation:rg 2.4s ease-out infinite}.rg.b{animation-delay:1.2s}
.pbw.off .rg{display:none}
@keyframes rg{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.ok{position:absolute;inset:0;display:none;place-items:center;z-index:3;pointer-events:none}.ok.on{display:grid}
.ok svg{width:110px;height:110px;background:rgba(52,209,122,.15);border-radius:50%;padding:24px}.ok path{stroke:#34d17a;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .55s .1s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.wk{display:flex;justify-content:center;gap:10px;margin-top:6px;position:relative}
.wk div{flex:1;background:rgba(255,255,255,.07);border-radius:15px;padding:10px 6px;text-align:center}
.wk span{display:block;font-size:11.5px;color:var(--hero-mut)}.wk b{font:800 18px/1.3 'Zain','IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.loc{margin-top:12px;display:flex;align-items:center;gap:10px;border-radius:16px;padding:11px 13px;background:var(--card);border:1px solid var(--line);font-size:13px;line-height:1.55}
.loc svg{width:20px;height:20px;flex:none;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.loc.good svg{stroke:var(--ok)}.loc.bad svg{stroke:var(--red)}.loc.warn svg{stroke:var(--warn)}
.loc b{font-weight:700}.loc .rt{margin-inline-start:auto;border:0;background:var(--soft);border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
h2{font-size:15px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
h2 .sp{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.mn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mn div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.mn b{display:block;font:800 21px/1.3 'Zain','IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums}.mn span{font-size:11.5px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:8px}
.row .d{width:46px;text-align:center;flex:none}.row .d b{display:block;font:800 19px/1.1 'Zain',sans-serif}.row .d span{font-size:11px;color:var(--mut)}
.row .m{flex:1;min-width:0;font-size:13px;color:var(--mut);direction:ltr;text-align:right}.row .m b{color:var(--ink);font-weight:700}
.row .h{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.tg{display:inline-block;font-size:10.5px;border-radius:999px;padding:2px 7px;font-weight:700;margin-inline-start:4px;direction:rtl}
.tg.l{background:rgba(217,130,0,.14);color:var(--warn)}.tg.o{background:rgba(224,27,15,.12);color:var(--red)}.tg.x{background:rgba(30,154,76,.14);color:var(--ok)}
.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:22px 0}
.nv{border:1px solid var(--line);background:var(--card);border-radius:10px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.nv svg{width:15px;height:15px;stroke:var(--mut);fill:none;stroke-width:2.4;stroke-linecap:round}
.nv[disabled]{opacity:.35}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}.sh.on{display:flex}
.sh .bx{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 16px max(22px,env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;inset-inline:16px;bottom:max(20px,env(safe-area-inset-bottom));max-width:488px;margin:0 auto;background:#16110F;color:#fff;border-radius:14px;padding:13px 15px;font-size:14px;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);display:none;line-height:1.6}.toast.on{display:block;animation:up .2s ease}.toast.bad{background:var(--red2)}
.hide{display:none!important}
/* 4.61 · the center he is working at */
.vc{margin-top:12px;border-radius:20px;padding:15px;background:var(--card);border:1px solid var(--line)}
.vc.on{border-color:rgba(30,154,76,.45);background:linear-gradient(180deg,rgba(30,154,76,.09),transparent 70%),var(--card)}
.vc.ask{border-style:dashed;text-align:center}
.vc h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}.vc.ask h3{justify-content:center}
.vc .sub{font-size:12.5px;color:var(--mut);line-height:1.7}
.vc .big{font:800 20px/1.35 'Zain','IBM Plex Sans Arabic',sans-serif;margin:2px 0}
.vc .acts{display:flex;gap:8px;margin-top:12px}.vc .acts .btn{height:46px;font-size:14.5px}
.vc .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(30,154,76,.14);flex:none}
.vc .ic svg{width:19px;height:19px;stroke:var(--ok);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vc .row1{display:flex;gap:10px;align-items:center}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--mut);margin-inline-start:4px}
.pill.g{background:rgba(30,154,76,.13);color:var(--ok)}.pill.r{background:rgba(224,27,15,.12);color:var(--red)}
.tl{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.tl div{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;color:var(--mut)}.tl b{color:var(--ink);font-weight:700}.tl i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.tl div.o i{background:var(--ok)}
.tl span:last-child{margin-inline-start:auto;font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}.tl b{min-width:0}
.cs{max-height:min(62vh,520px);overflow:auto;margin:10px -4px 0;padding:0 4px}
.ci{display:flex;align-items:center;gap:10px;padding:12px;border-radius:15px;border:1px solid var(--line);background:var(--card);margin-bottom:8px;cursor:pointer;width:100%;text-align:right}
.ci:active{transform:scale(.99)}.ci.sel{border-color:var(--red);box-shadow:0 0 0 2px rgba(224,27,15,.18)}
.ci .t{flex:1;min-width:0}.ci b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .d{font-size:11.5px;font-weight:700;color:var(--ok);white-space:nowrap}.ci .d.f{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
.sh .bx h2{margin:0 0 4px}
/* 4.63 · المهام + بنك الأعطال + الإشعارات */
.vc.tk{border-color:rgba(224,27,15,.35);background:linear-gradient(180deg,rgba(224,27,15,.07),transparent 70%),var(--card)}
.vc.tk.going{border-color:rgba(30,154,76,.45);background:linear-gradient(180deg,rgba(30,154,76,.09),transparent 70%),var(--card)}
.vc.tk .ic{background:rgba(224,27,15,.12);font-size:18px}.vc.tk.going .ic,.vc.tk.arrived .ic{background:rgba(30,154,76,.14)}
.trk{position:relative;height:10px;border-radius:99px;background:rgba(128,128,128,.3);margin:22px 8px 8px}
.trk i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:linear-gradient(90deg,var(--ok),#7ad39a);transition:width 1s}
.trk em{position:absolute;top:-17px;font-style:normal;font-size:20px;transform:translateX(50%);transition:inset-inline-start 1s;line-height:1}
.trk b{position:absolute;inset-inline-end:-6px;top:-17px;font-size:20px;line-height:1}
.tk .nums{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin:0 6px}
.tk .nums b{color:var(--ink)}
.fbk{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:13px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:right}
.fbk .ic{font-size:22px}.fbk b{display:block;font-size:14.5px}.fbk small{color:var(--mut);font-size:12px}
.fres{max-height:min(56vh,480px);overflow:auto;margin:10px -4px 0;padding:0 4px}
.fi{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:12px;margin-bottom:8px}
.fi h4{margin:0 0 4px;font-size:14.5px}.fi .sol{font-size:13.5px;line-height:1.8;background:rgba(30,154,76,.09);border-radius:10px;padding:8px 10px;margin:6px 0}
.fi .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11.5px;color:var(--mut);align-items:center}
.fi .cd{font:700 11.5px monospace;background:var(--soft);border-radius:7px;padding:1px 7px;direction:ltr}
.fi .rep{color:var(--red);font-weight:700}
.fi .vt{margin-inline-start:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}.fi .vt.on{background:rgba(30,154,76,.14);border-color:var(--ok);color:var(--ok);font-weight:700}
.bell{position:relative}.bell.on::after{content:"";position:absolute;top:7px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pushb{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:16px;border:1px dashed var(--line);background:var(--card);font-size:13px}.pushb .btn{width:auto;height:38px;padding:0 14px;font-size:13px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div class="toast" id="toast"></div>
<div class="sh" id="csh"><div class="bx">
  <h2>إنت شغّال في أنهي مركز؟</h2>
  <p class="hint" style="text-align:right;margin:0">الأقرب لمكانك فوق. اختار المركز وبعدين اختار إنت بتعمل إيه.</p>
  <input class="in" id="csq" placeholder="🔎 دوّر باسم المركز" style="margin-top:10px">
  <div class="cs" id="csl"><div class="empty">بنحمّل المراكز…</div></div>
  <div id="csx" class="hide">
    <div class="chips" id="csp"></div>
    <input class="in" id="csn" maxlength="200" placeholder="ملاحظة (اختياري) — مثلاً: سلّمت 5 كرتونة A4">
    <div style="display:flex;gap:10px;margin-top:12px"><button class="btn" id="csgo">أنا هنا ✓</button><button class="btn ghost" id="csno" style="width:38%">إلغاء</button></div>
  </div>
  <div id="csx0" style="margin-top:10px"><button class="btn ghost" id="csno0">إلغاء</button></div>
</div></div>
<div class="sh" id="fsh"><div class="bx">
  <h2>🛠 بنك الأعطال</h2>
  <p class="hint" style="text-align:right;margin:0">دوّر بكود العطل أو بوصفه — هتلاقي الحل ومين اللي حلّه.</p>
  <input class="in" id="fq" placeholder="🔎 كود العطل أو كلمة من وصفه" style="margin-top:10px" autocomplete="off">
  <div class="fres" id="fl"><div class="empty">بنحمّل…</div></div>
  <div id="fnew" class="hide" style="margin-top:8px">
    <input class="in" id="fc" placeholder="كود العطل (اختياري) مثلاً E45" maxlength="30" dir="ltr" style="margin-bottom:8px">
    <input class="in" id="ft" placeholder="وصف العطل" maxlength="160" style="margin-bottom:8px">
    <textarea class="in" id="fs" placeholder="الحل اللي اشتغل" maxlength="800" rows="3" style="height:auto;padding:10px 14px;margin-bottom:8px"></textarea>
    <div style="display:flex;gap:10px"><button class="btn" id="fsv">حفظ الحل</button><button class="btn ghost" id="fcn" style="width:38%">رجوع</button></div>
  </div>
  <div id="fbt" style="display:flex;gap:10px;margin-top:10px"><button class="btn" id="fadd">＋ سجّل حل جديد</button><button class="btn ghost" id="fx" style="width:34%">إغلاق</button></div>
</div></div>
<div class="sh" id="esh"><div class="bx">
  <h2>خلّصت في <span id="ec"></span>؟</h2>
  <p class="hint" style="text-align:right;margin:0">لو كان فيه عطل وحلّيته، سجّل الحل — أي زميل يدوّر بالكود هيلاقيه.</p>
  <input class="in" id="ecd" placeholder="كود العطل (اختياري)" maxlength="30" dir="ltr" style="margin-top:10px">
  <input class="in" id="etl" placeholder="وصف العطل" maxlength="160" style="margin-top:8px">
  <textarea class="in" id="esl" placeholder="الحل اللي اشتغل" maxlength="800" rows="3" style="height:auto;padding:10px 14px;margin-top:8px"></textarea>
  <div style="display:flex;gap:10px;margin-top:12px"><button class="btn" id="ego">✓ خلّصت</button><button class="btn ghost" id="eno" style="width:34%">إلغاء</button></div>
</div></div>
<div class="sh" id="pwsh"><div class="bx">
  <h2 style="margin-top:0">تغيير كلمة السر</h2>
  <div class="err" id="pwerr"></div>
  <div class="fld"><label>كلمة السر الحالية</label><input class="in" type="password" id="pwo" autocomplete="current-password"></div>
  <div class="fld"><label>كلمة السر الجديدة (6 حروف على الأقل)</label><input class="in" type="password" id="pwn" autocomplete="new-password"></div>
  <div style="display:flex;gap:10px"><button class="btn" id="pwgo">حفظ</button><button class="btn ghost" id="pwno" style="width:38%">إلغاء</button></div>
</div></div>
<script>
(function () {
  'use strict';
  var BASE = location.pathname.replace(/\/staff\/?$/, '');
  var API = BASE + '/staff/api';

  $('csq').oninput = paintCenters;
  $('csno').onclick = $('csno0').onclick = function () { $('csh').classList.remove('on'); };
  $('csh').onclick = function (e) { if (e.target === this) this.classList.remove('on'); };
  $('csgo').onclick = function () {
    if (!CS.pick || busy) return; busy = true; var b = this; b.disabled = true;
    var fin = function () { busy = false; b.disabled = false; };
    getPos(true).catch(function (e) { if (H.need_location) throw e; return null; }).then(function (p) {
      return battery().then(function (bt) { return api('POST', '/visit', { center: CS.pick, purpose: CS.purpose, note: $('csn').value.trim(), lat: p && p.lat, lng: p && p.lng, acc: p && p.acc, battery: bt }); });
    }).then(function (r) {
      fin(); $('csh').classList.remove('on'); $('csn').value = '';
      H = r.home; syncClock(H.now.ts); paintVisit(); paintLoc();
      toast(r.far ? 'اتسجّل — بس إنت بعيد ' + r.dist + ' م عن مكان المركز المعروف' : 'اتسجّل إنك في ' + (H.visit ? H.visit.center : 'المركز') + ' ✅', !!r.far);
    }).catch(function (e) { fin(); if (e && (e.message || e.code)) toast(e.status ? e.message : posErr(e), true); });
  };
  function endVisit() {
    $('ec').textContent = H.visit ? H.visit.center : 'المركز'; $('ecd').value = $('etl').value = $('esl').value = ''; $('esh').classList.add('on');
  }
  $('eno').onclick = function () { $('esh').classList.remove('on'); };
  $('esh').onclick = function (e) { if (e.target === this) this.classList.remove('on'); };
  $('ego').onclick = function () {
    if (busy) return;
    var t = $('etl').value.trim(), s = $('esl').value.trim(), c = $('ecd').value.trim();
    if ((t || c) && !(t && s)) return toast('اكتب وصف العطل والحل مع بعض — أو سيبهم فاضيين', true);
    busy = true; var b = this; b.disabled = true;
    var fin = function () { busy = false; b.disabled = false; };
    getPos(true).catch(function () { return null; }).then(function (p) { return api('POST', '/visit/end', { lat: p && p.lat, lng: p && p.lng, fault: t && s ? { code: c, title: t, solution: s } : null }); })
      .then(function (r) { fin(); $('esh').classList.remove('on'); H = r.home; paintVisit(); paintTasks(); paintLoc(); toast(r.fault ? 'خلّصت — والحل اتسجّل في بنك الأعطال 🛠' : 'تمام — خلّصت في المركز'); startTaskPings(); }).catch(function (e) { fin(); if (e.message) toast(e.message, true); });
  };

  /* ── 4.63 · المهام: «ابدأ الطريق» → الموقع كل 30 ثانية → وصلت ── */
  function kmText(m) { return m == null ? '' : (m < 1000 ? m + ' م' : (m / 1000).toFixed(1) + ' كم'); }
  function paintTasks() {
    var el = $('tsk'); if (!el || !H) return;
    var list = (H.tasks || []).filter(function (t) { return !(t.status === 'arrived' && H.visit && H.visit.center_key === t.center_key); });
    el.innerHTML = list.map(function (t) {
      var going = t.status === 'going', arr = t.status === 'arrived';
      var head = '<div class="row1"><span class="ic">' + (arr ? '📍' : '🚗') + '</span><div style="flex:1;min-width:0"><div class="sub">' + (arr ? 'وصلت — ابدأ الزيارة' : going ? 'في الطريق إلى' : 'مهمة جديدة من الإدارة') + '</div><div class="big">' + esc(t.center) + '</div></div></div>';
      var info = '<div class="sub">' + esc(t.title) + (t.note ? ' · ' + esc(t.note) : '') + '</div>';
      var bar = going ? '<div class="trk"><i style="width:' + t.pct + '%"></i><em style="inset-inline-start:' + t.pct + '%">🚶</em><b>🏥</b></div><div class="nums"><span>باقي <b>' + (t.dist != null ? kmText(t.dist) : '—') + '</b></span><span>' + (t.eta ? 'حوالي <b>' + t.eta + '</b> دقيقة' : '') + '</span><span><b>' + t.pct + '%</b></span></div>' : '';
      var acts = !H.state || H.state !== 'in' ? '<div class="sub" style="margin-top:8px">سجّل حضورك الأول علشان تبدأ المهمة.</div>' :
        t.status === 'new' ? '<div class="acts"><button class="btn" data-ts="' + t.id + '">🚗 ابدأ الطريق</button></div>' :
        going ? '<div class="acts"><button class="btn" data-ta="' + t.id + '">وصلت ✓</button></div>' :
        '<div class="acts"><button class="btn" data-tv="' + t.id + '">ابدأ الزيارة هنا</button></div>';
      return '<div class="vc tk ' + t.status + '">' + head + info + bar + acts + '</div>';
    }).join('');
    [].forEach.call(el.querySelectorAll('[data-ts]'), function (b) { b.onclick = function () { taskStart(b); }; });
    [].forEach.call(el.querySelectorAll('[data-ta]'), function (b) { b.onclick = function () { taskArrive(b); }; });
    [].forEach.call(el.querySelectorAll('[data-tv]'), function (b) { b.onclick = function () { taskVisit(b); }; });
  }
  function taskById(id) { return (H.tasks || []).filter(function (t) { return String(t.id) === String(id); })[0]; }
  function taskStart(b) {
    if (busy) return; busy = true; b.disabled = true;
    var fin = function () { busy = false; b.disabled = false; };
    getPos(true).catch(function (e) { if (H.need_location) throw e; return null; }).then(function (p) { return battery().then(function (bt) { return api('POST', '/task/start', { id: b.dataset.ts, lat: p && p.lat, lng: p && p.lng, acc: p && p.acc, battery: bt }); }); })
      .then(function () { fin(); return load(); }).then(function () { toast('ماشي — الإدارة شايفاك في الطريق 🚗'); }).catch(function (e) { fin(); if (e && (e.message || e.code)) toast(e.status ? e.message : posErr(e), true); });
  }
  function taskArrive(b) {
    if (busy) return; busy = true; b.disabled = true;
    api('POST', '/task/arrive', { id: b.dataset.ta }).then(function () { busy = false; return load(); }).catch(function (e) { busy = false; b.disabled = false; if (e.message) toast(e.message, true); });
  }
  function taskVisit(b) {
    var t = taskById(b.dataset.tv); if (!t || busy) return; busy = true; b.disabled = true;
    var fin = function () { busy = false; b.disabled = false; };
    getPos(true).catch(function (e) { if (H.need_location) throw e; return null; }).then(function (p) { return battery().then(function (bt) { return api('POST', '/visit', { center: t.center_key, task: t.id, purpose: 'متابعة / زيارة', lat: p && p.lat, lng: p && p.lng, acc: p && p.acc, battery: bt }); }); })
      .then(function (r) { fin(); H = r.home; paintVisit(); paintTasks(); paintLoc(); toast('اتسجّل إنك في ' + t.center + ' ✅'); }).catch(function (e) { fin(); if (e && (e.message || e.code)) toast(e.status ? e.message : posErr(e), true); });
  }
  function goingTask() { return (H && H.state === 'in' && (H.tasks || []).filter(function (t) { return t.status === 'going'; })[0]) || null; }
  function startTaskPings() {
    clearInterval(taskTimer); taskTimer = 0;
    if (!goingTask()) return;
    var send = function () {
      var t = goingTask(); if (!t) { clearInterval(taskTimer); taskTimer = 0; return; }
      getPos(true).then(function (p) { return battery().then(function (bt) { return api('POST', '/task/ping', { id: t.id, lat: p.lat, lng: p.lng, acc: p.acc, battery: bt }); }); }).then(function (r) {
        if (r && r.stop) return load();
        if (r && r.task) { for (var i = 0; i < H.tasks.length; i++) if (H.tasks[i].id === r.task.id) H.tasks[i] = r.task; }
        if (r && r.arrived) { toast('🎉 وصلت! دوس «ابدأ الزيارة هنا»'); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
        paintTasks(); paintLoc();
      }).catch(function () {});
    };
    send(); taskTimer = setInterval(send, 30000);
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && H && goingTask() && !taskTimer) startTaskPings(); });

  /* ── 4.63 · بنك الأعطال ── */
  var fqT = 0;
  function openFaults() { $('fq').value = ''; $('fnew').className = 'hide'; $('fbt').className = ''; $('fsh').classList.add('on'); searchFaults(); }
  function searchFaults() {
    api('GET', '/faults?q=' + encodeURIComponent($('fq').value.trim())).then(function (r) {
      var q = $('fq').value.trim();
      $('fl').innerHTML = r.list.length ? (q ? '' : '<div class="hint" style="text-align:right;margin:2px 4px 8px">الأحدث والأعلى تقييمًا (' + r.total + ' حل)</div>') + r.list.map(function (f) {
        return '<div class="fi"><h4>' + esc(f.title) + '</h4>' + (f.code ? '<span class="cd">' + esc(f.code) + '</span>' : '') + '<div class="sol">' + esc(f.solution) + '</div><div class="meta"><span>👷 ' + esc(f.emp) + '</span>' + (f.center ? '<span>🏥 ' + esc(f.center) + '</span>' : '') + '<span>' + esc(f.at.slice(0, 10)) + '</span>' + (f.repeats > 1 ? '<span class="rep">اتكرر ' + f.repeats + ' مرات</span>' : '') +
          '<button class="vt' + (f.voted ? ' on' : '') + '" data-v="' + f.id + '">👍 ' + f.votes + '</button></div></div>';
      }).join('') : '<div class="empty">' + (q ? 'مفيش حل مسجّل للعطل ده — لو حلّيته سجّله 👇' : 'لسه مفيش حلول — كن أول واحد يسجّل') + '</div>';
      [].forEach.call($('fl').querySelectorAll('.vt'), function (b) { b.onclick = function () { api('POST', '/fault/vote', { id: Number(b.dataset.v) }).then(function (r) { b.textContent = '👍 ' + r.votes; b.classList.toggle('on', r.voted); }).catch(function (e) { toast(e.message, true); }); }; });
    }).catch(function (e) { $('fl').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  $('fq').oninput = function () { clearTimeout(fqT); fqT = setTimeout(searchFaults, 280); };
  $('fx').onclick = function () { $('fsh').classList.remove('on'); };
  $('fsh').onclick = function (e) { if (e.target === this) this.classList.remove('on'); };
  $('fadd').onclick = function () { $('fnew').className = ''; $('fbt').className = 'hide'; $('ft').value = $('fq').value.trim(); };
  $('fcn').onclick = function () { $('fnew').className = 'hide'; $('fbt').className = ''; };
  $('fsv').onclick = function () {
    var t = $('ft').value.trim(), s = $('fs').value.trim(); if (!t || !s) return toast('اكتب وصف العطل والحل', true);
    api('POST', '/fault', { code: $('fc').value.trim(), title: t, solution: s }).then(function () { $('fc').value = $('ft').value = $('fs').value = ''; $('fnew').className = 'hide'; $('fbt').className = ''; toast('اتسجّل الحل 🛠 — الكل اتبلّغ'); H.faults = (H.faults || 0) + 1; searchFaults(); }).catch(function (e) { toast(e.message, true); });
  };

  /* ── 4.63 · إشعارات على الموبايل (من غير أي خدمة خارجية) ── */
  function pushOK() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function b64u(s) { var p = '='.repeat((4 - s.length % 4) % 4), b = (s + p).replace(/-/g, '+').replace(/_/g, '/'), r = atob(b), o = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) o[i] = r.charCodeAt(i); return o; }
  function askPush() {
    if (!pushOK()) return toast('الإشعارات مش مدعومة هنا — على الآيفون ضيف الصفحة للشاشة الرئيسية الأول', true);
    if (pushOn) { return navigator.serviceWorker.getRegistration('/staff').then(function (reg) { return reg && reg.pushManager.getSubscription(); }).then(function (sub) { if (sub) { api('POST', '/push/off', { endpoint: sub.endpoint }).catch(function () {}); return sub.unsubscribe(); } }).then(function () { pushOn = false; ls.set('ozs_push', '0'); var b = $('bbl'); if (b) b.classList.remove('on'); paintPushBanner(); toast('اتقفلت الإشعارات'); }); }
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') throw new Error('الإشعارات اتمنعت — فعّلها من إعدادات المتصفح للموقع ده');
      return navigator.serviceWorker.register('/staff-sw.js', { scope: '/staff' }).then(function () { return navigator.serviceWorker.ready; }).then(function () { return navigator.serviceWorker.getRegistration('/staff'); });
    }).then(function (reg) { return api('GET', '/push/key').then(function (k) { return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(k.key) }); }); })
      .then(function (sub) { return api('POST', '/push/subscribe', { subscription: sub.toJSON() }); })
      .then(function () { pushOn = true; ls.set('ozs_push', '1'); var b = $('bbl'); if (b) b.classList.add('on'); paintPushBanner(); toast('الإشعارات شغّالة ✅ — هيوصلك أي مهمة جديدة'); })
      .catch(function (e) { toast(e.message || 'مقدرتش أفعّل الإشعارات', true); });
  }
  function paintPushBanner() {
    var el = $('pushb'); if (!el) return;
    el.innerHTML = pushOK() && !pushOn && (!window.Notification || Notification.permission !== 'denied') ? '<div class="pushb"><span style="flex:1">🔔 فعّل الإشعارات علشان توصلك المهام الجديدة وحلول الأعطال حتى والتطبيق مقفول.</span><button class="btn" id="pbo">تفعيل</button></div>' : '';
    var b = $('pbo'); if (b) b.onclick = askPush;
  }

  /* ── month ── */
  function paintHist() {
    if (!hist) return;
    var m = hist, ym = m.month.split('-');
    $('ml').textContent = MONTHS[+ym[1] - 1] + ' ' + ym[0];
    $('mnx').disabled = m.month >= H.now.date.slice(0, 7);
    $('mn').innerHTML = '<div><b>' + m.days + '</b><span>يوم حضور</span></div><div><b>' + dur(m.mins) + '</b><span>ساعات الشغل</span></div><div><b>' + m.late + '</b><span>مرات تأخير</span></div>';
    var rows = m.list.slice().reverse();
    $('hl').innerHTML = rows.length ? rows.map(function (r) {
      var dd = r.date.split('-'), tags = '';
      if (r.late) tags += '<span class="tg l">تأخير ' + r.late + ' د</span>';
      if (r.out_of_range) tags += '<span class="tg o">برّه المكان</span>';
      if (r.over >= 30) tags += '<span class="tg x">إضافي ' + dur(r.over) + '</span>';
      if (r.open && r.date !== H.now.date) tags += '<span class="tg o">من غير انصراف</span>';
      return '<div class="row"><div class="d"><b>' + (+dd[2]) + '</b><span>' + DAYS[new Date(r.date + 'T00:00:00Z').getUTCDay()] + '</span></div><div class="m"><b>' + hm(r.in_at) + '</b> ← ' + (r.out_at ? '<b>' + hm(r.out_at) + '</b>' : 'مفتوح') + '</div><div>' + tags + '</div><div class="h">' + dur(r.worked) + '</div></div>';
    }).join('') : '<div class="empty">مفيش حضور مسجّل في الشهر ده</div>';
  }
  function shift(n) {
    var p = month.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1 + n, 1)), nm = d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1);
    if (nm > H.now.date.slice(0, 7)) return;
    api('GET', '/history?month=' + nm).then(function (r) { month = nm; hist = r; paintHist(); }).catch(function (e) { if (e.message) toast(e.message, true); });
  }

  /* ── password ── */
  $('pwno').onclick = function () { $('pwsh').classList.remove('on'); };
  $('pwsh').onclick = function (e) { if (e.target === this) this.classList.remove('on'); };
  $('pwgo').onclick = function () {
    var er = $('pwerr'); er.className = 'err';
    api('POST', '/password', { old: $('pwo').value, new: $('pwn').value }).then(function () { $('pwsh').classList.remove('on'); toast('اتغيّرت كلمة السر ✅'); })
      .catch(function (e) { er.textContent = e.message; er.className = 'err on'; });
  };

  /* ── start ── */
  fetch(API + '/brand').then(function (r) { return r.json(); }).catch(function () { return {}; }).then(function (b) {
    brand = b || brand; if (brand.name) document.title = 'حضور وانصراف — ' + brand.name;
    if (TOKEN) load().then(function () { if (!H) renderLogin(); }); else renderLogin();
  });
})();
</script>
</body>
</html>
