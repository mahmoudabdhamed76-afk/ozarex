<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>OZAREX</title>
  <desc>OZAREX wordmark on black with a gold edge glow. O, Z, A, R and E are white; the A includes its crossbar. The X is a gold gradient and its top-right stroke ends in an upward arrow. Letterforms are outlined paths, so the icon does not depend on a font. Ink stays inside the maskable safe circle (80% of the canvas).</desc>
  <defs>
    <linearGradient id="xgold" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4A537"/>
      <stop offset="1" stop-color="#F2C14E"/>
    </linearGradient>
    <filter id="edge-glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="edge-core" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0b0b0b"/>
  <g>
    <rect x="-6" y="-6" width="524" height="524" rx="136" fill="none" stroke="#F2C14E" stroke-width="26" filter="url(#edge-glow)" opacity="0.42"/>
    <rect x="6" y="6" width="500" height="500" rx="124" fill="none" stroke="#E7C15A" stroke-width="8" filter="url(#edge-core)" opacity="0.55"/>
  </g>
